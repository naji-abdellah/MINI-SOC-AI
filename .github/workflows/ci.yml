name: MiniSOC-AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test, Validate Rules & Run Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Detection Rules
        run: |
          python -c "
          from detections.engine import DetectionEngine
          import duckdb
          conn = duckdb.connect(':memory:')
          engine = DetectionEngine(db_conn=conn)
          count = engine.load_rules_from_dir('detections/rules')
          print(f'Successfully loaded and validated {count} detection rules.')
          assert count >= 8, f'Expected at least 8 rules, found {count}'
          "

      - name: Run Pytest Test Suite
        run: |
          pytest -v

      - name: Run Evaluation Suite & Hallucination Check
        run: |
          python evals/run_evals.py
