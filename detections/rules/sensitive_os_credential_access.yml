id: soc-rule-cred-010
title: Sensitive OS Credential Store Probing
description: Detects attempts to access Unix password hashes or Windows SAM hive locations.
author: Naji Abdellah
status: stable
severity: critical
references:
  - https://attack.mitre.org/techniques/T1003/
tags:
  - credential-access
  - shadow
  - sam
mitre:
  tactic: Credential Access
  technique_id: T1003
  technique_name: OS Credential Dumping
detection:
  type: pattern
  url_patterns:
    - "/etc/shadow"
    - "/etc/security/opasswd"
    - "system32/config/sam"
    - "system32/config/system"
  raw_patterns:
    - "/etc/shadow"
    - "config/sam"
falsepositives:
  - Security audit scripts with verified authorized hash inspection.
